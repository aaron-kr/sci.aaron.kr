title: Scientia AI
tagline: "a bilingual, research-first reading log for AI"
description: >-
  A bilingual (English/Korean) reading log — research papers first (Physical AI,
  General AI, handwritten script recognition/OCR, biomedical AI), news second.
  Built by a solo AI researcher rebuilding a daily reading habit, shared publicly
  because it's also useful to other researchers, students, and professors.
url: "https://sci.aaron.kr"
baseurl: ""
# Set once the Weekly Reading Discussions repo/category exists (see
# US_ROADMAP.md-style planning notes) — linked from /tools/. Leave blank to
# hide that link until then.
discussions_url: "https://github.com/aaronkr-2026-2/research-methods-course/discussions"
author: Aaron Snowberger
twitter_handle: ""
lang: en

markdown: kramdown
plugins:
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:path/
  news:
    output: true
    permalink: /news/:path/
  alerts:
    output: false

defaults:
  - scope:
      path: ""
      type: research
    values:
      layout: entry
      kind: research
  - scope:
      path: ""
      type: news
    values:
      layout: entry
      kind: news

exclude:
  - CLAUDE.md
  - README.md
  - SETUP.md
  - AUTH_SETUP.md
  - PAPERS.md
  - US_ROADMAP.md
  - Claude-code-v1-notes.md
  - LICENSE
  - sources.example.json
  - frequency-concept.html
  - sci.html
  - Gemfile
  - Gemfile.lock
  - scripts
  - functions
  - firebase.json
  - firestore.rules
  - requirements.txt

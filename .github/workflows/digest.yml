name: Weekly digest

on:
  schedule:
    # Fridays 20:00 UTC ≈ Sat 05:00 KST — change the day/time here, see SETUP.md
    - cron: "0 20 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send weekly digest
        run: python scripts/send_digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}

      - name: Reset "marked for class" now that the digest has gone out
        run: python scripts/reset_class_marks.py

      - name: Commit reset
        run: |
          git config user.name "scientia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _research
          git diff --cached --quiet || git commit -m "Reset marked_for_class after weekly digest: $(date -u +%F)"
          git push

# Semester boundaries are computed automatically (Mar=spring, Jul=summer,
# Sep=fall, Jan=winter — see semesterId()/semesterStart() in auth.js), so
# nothing to configure there. skip_weeks only matters for the rare case of
# force-suppressing a week that *did* get something marked (e.g. by mistake
# during a break) — a week with nothing marked never appears anyway.
skip_weeks: {}
